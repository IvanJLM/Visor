# project.yml — Visor, a minimal native image viewer for macOS (Apple Silicon only)
name: Visor
options:
  bundleIdPrefix: com.ivanjlm
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  groupSortPosition: top
  defaultLocalization: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # Apple Silicon only.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    # Local ad-hoc signing: no Apple Developer account needed.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
  configs:
    Release:
      DEAD_CODE_STRIPPING: YES
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      STRIP_INSTALLED_PRODUCT: YES

targets:
  Visor:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivanjlm.visor
        INFOPLIST_FILE: App/Resources/Info.plist
        PRODUCT_NAME: Visor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  VisorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Visor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivanjlm.visor.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Visor:
    build:
      targets:
        Visor: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VisorTests
